schema: phdude.research-policy
version: 1

network:
  enabled: false

providers:
  - openalex
  - crossref
  - arxiv

research:
  year_range:
    from: 2021

  peer_reviewed: preferred

  quartiles:
    allowed:
      - Q1
      - Q2

  languages:
    - en
    - es

  regions:
    priority:
      - Latin America

  freshness:
    always_check_recent: true
    stale_after_days: 180

  preprints:
    require_approval: true

  limit: 20

execution:
  enabled: false
  runtimes:
    node: node
    python3: python3
    Rscript: Rscript
  timeout_seconds: 600

skills:
  allow_network: false
  allow_execution: false

health:
  weights:
    literature_coverage: 0.15
    evidence_strength: 0.20
    methodological_integrity: 0.15
    citation_quality: 0.15
    freshness: 0.10
    reproducibility: 0.10
    consistency: 0.10
    prose_quality: 0.05

ready:
  min_health: 70
  require:
    - no-open-conflicts
    - no-disputed-pairs
    - no-block-reviews
    - all-sections-approved
    - figures-alt
    - repro-clean
    - citations-clean
