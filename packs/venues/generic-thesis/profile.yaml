schema: phdude.profile
version: 1
name: generic-thesis
display: Generic thesis
description: >-
  A university thesis or dissertation: IMRaD plus conclusions, APA references, and limits
  generous enough that only a runaway section trips them. The default when a manuscript has no
  venue in mind yet.
document_class: report
citation_style: csl/apa.csl
sections:
  - id: abstract
    title: Abstract
    required: true
    order: 1
    synonyms: [summary]
  - id: introduction
    title: Introduction
    required: true
    order: 2
    max_words: 6000
    synonyms: [intro, background]
  - id: methods
    title: Methods
    required: true
    order: 3
    max_words: 8000
    synonyms: [method, methodology, materials-and-methods, approach]
  - id: results
    title: Results
    required: true
    order: 4
    max_words: 8000
    synonyms: [result, findings, evaluation]
  - id: discussion
    title: Discussion
    required: true
    order: 5
    max_words: 8000
  - id: conclusions
    title: Conclusions
    required: true
    order: 6
    max_words: 3000
    synonyms: [conclusion, concluding-remarks, closing]
abstract:
  max_words: 500
figures:
  formats: [pdf, png]
  min_dpi: 300
tables:
  style: booktabs
references:
  style: APA 7th edition
templates:
  latex: templates/report.tex
writing:
  first_person: sparing
  tense_abstract: past
