<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="figure-title figure-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="figure-title">Mean latency by precision</title>
<desc id="figure-desc">Bar chart: mean inference latency at a fixed batch size falls from 240 ms at half precision to 150 ms at eight-bit and 120 ms at four-bit precision.</desc>
<rect width="720" height="420" fill="#ffffff"/>
<text x="360" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Mean latency by precision</text>
<line x1="72" y1="332" x2="696" y2="332" stroke="#d9d9d9" stroke-width="1"/>
<text x="62" y="332" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#1a1a1a">0</text>
<line x1="72" y1="240" x2="696" y2="240" stroke="#d9d9d9" stroke-width="1"/>
<text x="62" y="240" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#1a1a1a">100</text>
<line x1="72" y1="148" x2="696" y2="148" stroke="#d9d9d9" stroke-width="1"/>
<text x="62" y="148" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#1a1a1a">200</text>
<line x1="72" y1="56" x2="696" y2="56" stroke="#d9d9d9" stroke-width="1"/>
<text x="62" y="56" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#1a1a1a">300</text>
<line x1="72" y1="332" x2="696" y2="332" stroke="#767676" stroke-width="1.5"/>
<line x1="72" y1="56" x2="72" y2="332" stroke="#767676" stroke-width="1.5"/>
<rect x="113.6" y="111.2" width="124.8" height="220.8" fill="#0072b2"/>
<text x="176" y="104.2" text-anchor="middle" font-size="12" fill="#1a1a1a">240</text>
<text x="176" y="348" text-anchor="end" font-size="12" fill="#1a1a1a" transform="rotate(-30 176 348)">fp16</text>
<rect x="321.6" y="194" width="124.8" height="138" fill="#0072b2"/>
<text x="384" y="187" text-anchor="middle" font-size="12" fill="#1a1a1a">150</text>
<text x="384" y="348" text-anchor="end" font-size="12" fill="#1a1a1a" transform="rotate(-30 384 348)">int8</text>
<rect x="529.6" y="221.6" width="124.8" height="110.4" fill="#0072b2"/>
<text x="592" y="214.6" text-anchor="middle" font-size="12" fill="#1a1a1a">120</text>
<text x="592" y="348" text-anchor="end" font-size="12" fill="#1a1a1a" transform="rotate(-30 592 348)">int4</text>
<text x="20" y="194" text-anchor="middle" font-size="13" fill="#1a1a1a" transform="rotate(-90 20 194)">latency_by_precision (milliseconds)</text>
</svg>
